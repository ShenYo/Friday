name: Payload hooks

# This repository runs the payload's own hooks: core.hooksPath points at
# payload/.agents/githooks, so there is no copy here to drift from them. What
# can still go wrong unseen is the mode. git silently skips a hook that is not
# executable ("hint: ... hook was ignored because it's not set as
# executable") and the commit goes through -- here, and in every consumer the
# file is copied to.

on:
  pull_request:
    paths: ["payload/.agents/githooks/**", ".github/workflows/hooks-drift.yml"]
  push:
    branches-ignore: [main]
    paths: ["payload/.agents/githooks/**", ".github/workflows/hooks-drift.yml"]

permissions:
  contents: read

jobs:
  hooks-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every payload hook is executable in git
        run: |
          fail=0
          n=0
          while read -r mode _ _ file; do
            n=$((n + 1))
            if [ "$mode" = 100755 ]; then
              echo "ok    $file"
            else
              echo "MODE  $file is $mode, not 100755 -- git would skip it"
              fail=1
            fi
          done < <(git ls-files -s -- payload/.agents/githooks)
          [ "$n" -gt 0 ] || { echo "no payload hooks found"; exit 1; }
          exit "$fail"
      - name: Report what a failure above means
        if: failure()
        run: |
          echo "Restore the executable mode with: git update-index --chmod=+x <file>"
