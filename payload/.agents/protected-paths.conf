# Paths an agent must not write. One shell glob per line, relative to the repo
# root; `#` starts a comment. `*` spans `/`, so `docs/backup/*` covers every
# file at any depth beneath it.
#
# Read by .agents/hooks/guard-protected-paths.sh, which refuses the write and
# tells the agent to ask instead. Only paths belong here; rules that depend on
# judgement stay prose, because a hook cannot tell a proposed change from an
# unproposed one.
#
# An `append-only ` prefix means the path may be created but never changed: an
# existing file is protected, a new one is allowed. Use it for snapshots.
#
# This seed has no active entries. Add your own, for example:
#   CLAUDE.md
#   append-only docs/backup/*
